</head>

<body>

<header class="sub-header">
 <a href="index.html" class="logo">Erick Morell</a>

    <nav class="sub-nav">
        <a href="art.html" class="nav-link">Art</a>
        <a href="fabrication.html" class="nav-link active" aria-current="page">Sculptures & Fabrication</a>

</header>

<div class="page-title">
<h1>Sculptures & Fabrication</h1>
</div>

<section class="horizontal-section">

<h2>Project Gallery</h2>

<div class="projects-row">

    <a class="project-card" href="firefly-totem.html">
        <img src="images/fabrication/Fireflies%20Statue/6-Final%20Product%20on%20Stage.jpg" alt="Firefly Totem daytime installation">
        <h3>Firefly Totem</h3>
        <p>Sculptural Installation · Custom Fabrication</p>
    </a>

    <div class="project-card">
        <img src="images/fabrication/animatronic-creature/1.jpg" alt="Animatronic Creature">
        <h3>Animatronic Creature</h3>
    </div>

    <div class="project-card">
        <img src="images/fabrication/Scrappy/Scrappy1.jpg" alt="Moldmaking for Scrappy">
        <h3>Moldmaking for Scrappy</h3>
    </div>

</div>

</section>


<div id="fabrication-lightbox" class="lightbox">

<div class="lightbox-content">

<span class="lightbox-close">&times;</span>

<img id="fabrication-lightbox-img">
<div id="fabrication-image-caption"></div>

<div class="lightbox-nav">
<button id="fab-prev">◀</button>
<button id="fab-next">▶</button>
</div>

</div>

</div>


<script>

const projects = {
    "Animatronic Creature": [
        "images/fabrication/animatronic-creature/1.jpg",
        "images/fabrication/animatronic-creature/2.jpg",
        "images/fabrication/animatronic-creature/3.jpg",
        "images/fabrication/animatronic-creature/4.jpg"
    ],

    "Moldmaking for Scrappy": [
    {
        src: "images/fabrication/Scrappy/mold_1.jpg",
        caption: "Silicone Mold Preparation"
    },
    {
        src: "images/fabrication/Scrappy/mold_3.jpg",
        caption: "Silicone Mold Preparation for Replicas"
    },
    {
        src: "images/fabrication/Scrappy/mold_2.jpg",
        caption: "Two-Part Silicone Matrix Mold with Fiberglass Shell"
    },
    {
        src: "images/fabrication/Scrappy/Scrappy1.jpg",
        caption: "Scrappy"
    }
]
};

let gallery = [];
let index = 0;

const lightbox = document.getElementById("fabrication-lightbox");
const img = document.getElementById("fabrication-lightbox-img");
const caption = document.getElementById("fabrication-image-caption");

function showImage() {
    const current = gallery[index];

    img.src = typeof current === "string" ? current : current.src;
    caption.textContent = typeof current === "string" ? "" : current.caption;
}

document.querySelectorAll(".project-card").forEach(card => {
    card.addEventListener("click", (event) => {
        const title = card.querySelector("h3").textContent;
        if (!projects[title]) return;
        event.preventDefault();
        gallery = projects[title];
        index = 0;
        showImage();

        lightbox.classList.add("show");
        document.body.classList.add("lightbox-open");
    });
});

function closeLightbox() {
    lightbox.classList.remove("show");
    document.body.classList.remove("lightbox-open");
}

document.querySelector(".lightbox-close").onclick = closeLightbox;

document.getElementById("fab-next").onclick = () => {
    index = (index + 1) % gallery.length;
    showImage();
};

document.getElementById("fab-prev").onclick = () => {
    index = (index - 1 + gallery.length) % gallery.length;
    showImage();
};

document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("show")) return;

    if (e.key === "ArrowRight") {
    index = (index + 1) % gallery.length;
    showImage();
}

if (e.key === "ArrowLeft") {
    index = (index - 1 + gallery.length) % gallery.length;
    showImage();
    }

    if (e.key === "Escape") closeLightbox();
});

</script>

</body>
</html>
